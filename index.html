<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090910"><title>Motionkan Studio — AI Creative Workspace</title>
<style>
:root{--bg:#090910;--panel:#11121c;--panel2:#171827;--line:#292a3c;--text:#f5f6fc;--muted:#999bb0;--green:#b7ff35;--purple:#a56cff;--cyan:#63e8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#262044 0,transparent 35%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{color:inherit;cursor:pointer;border:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:20px 14px;background:#0b0b13;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;font-weight:850;font-size:18px;margin:5px 10px 28px}.logo{width:40px;height:40px;border-radius:12px;background:#080910;display:grid;place-items:center;box-shadow:0 0 22px #a56cff24;border:1px solid #37304d;overflow:hidden}.logo svg{width:100%;height:100%;padding:2px}.brand small{display:block;font-size:9px;letter-spacing:1.8px;color:var(--muted);font-weight:700;margin-top:3px}.nav-label{font-size:10px;color:#777b91;letter-spacing:1.5px;margin:19px 10px 8px}.nav button{width:100%;background:transparent;text-align:left;padding:11px;border-radius:11px;color:#b6b8ca;display:flex;gap:11px;align-items:center;margin:3px 0}.nav button:hover,.nav button.active{background:#1b1c2b;color:white}.nav button.active{box-shadow:inset 3px 0 var(--green)}.ico{width:20px;text-align:center}.sidebottom{position:absolute;bottom:16px;left:14px;right:14px;border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--muted);font-size:11px;line-height:1.5}.sidebottom b{color:white;display:block;margin-bottom:4px}.main{padding:28px clamp(16px,4vw,46px);max-width:1440px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.crumb{color:var(--muted);font-size:13px}.profile{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#9e75ff,var(--green));display:grid;place-items:center;color:#17151c;font-weight:800}.hero{padding:27px;border:1px solid #34334d;border-radius:22px;background:linear-gradient(120deg,#19182b,#11121b 65%,#1b2130);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle,#a56cff22,transparent 65%);right:-80px;top:-100px;pointer-events:none}.eyebrow{color:var(--green);font-size:10px;font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(28px,4vw,43px);margin:10px 0;letter-spacing:-1.3px}.hero p{color:#b5b6c8;max-width:640px;line-height:1.65;margin:0 0 22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 15px;border-radius:11px;font-weight:750;background:var(--green);color:#11150a}.btn.secondary{background:#232438;border:1px solid #37384e;color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:17px 0 28px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}.stat strong{font-size:22px;display:block;margin:7px 0}.stat span{color:var(--muted);font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}.section-head h2{font-size:18px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.module{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;min-height:145px;cursor:pointer;transition:.18s}.module:hover{transform:translateY(-2px);border-color:#555670;background:#171827}.module-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#24253b;margin-bottom:13px}.module h3{margin:0 0 7px;font-size:15px}.module p{color:var(--muted);font-size:12px;line-height:1.5;margin:0}.tag{display:inline-block;margin-top:11px;color:var(--green);font-size:10px;letter-spacing:.8px}.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project{padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:15px}.project h3{margin:11px 0 5px;font-size:15px}.project p{color:var(--muted);font-size:12px;margin:0}.pill{font-size:10px;padding:5px 8px;border-radius:20px;background:#24243a;color:#b8a5ff}.empty{color:var(--muted);font-size:13px;padding:18px;border:1px dashed #37384a;border-radius:14px;grid-column:1/-1}.pagepanel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.pagepanel h2{margin:0 0 7px}.pagepanel p{color:var(--muted);line-height:1.6}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #36374d;border-radius:10px;background:#0d0e16;color:white}.field textarea{min-height:90px;resize:vertical}.wide{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{width:min(540px,100%);background:#151622;border:1px solid #39394f;border-radius:18px;padding:20px;box-shadow:0 24px 70px #0008}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);font-size:13px;line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222438;border:1px solid #4a4b66;padding:11px 15px;border-radius:12px;display:none;box-shadow:0 10px 30px #0007;z-index:30}.mobilehead{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}.mobilehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{margin:0}.top{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.projects{grid-template-columns:1fr}}
@media(max-width:520px){.hero{padding:21px}.hero h1{font-size:29px}.grid{grid-template-columns:1fr}.module{min-height:auto}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.section-head{align-items:flex-start;flex-direction:column;gap:7px}.formgrid{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo" aria-label="Motionkan.ai logo"><svg viewBox="0 0 64 64" role="img"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7ff35"/><stop offset=".52" stop-color="#b7ff35"/><stop offset="1" stop-color="#a56cff"/></linearGradient></defs><path d="M12 22h13l5-7h12l5 7h5v27H12z" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round"/><circle cx="28" cy="34" r="10" fill="none" stroke="url(#lg)" stroke-width="4"/><path d="M24 43L40 30l-1 8 15-18-11 2 3 5-18 15z" fill="url(#lg)" stroke="#a56cff" stroke-width="1.5" stroke-linejoin="round"/><path d="M18 13h9" stroke="#b7ff35" stroke-width="4" stroke-linecap="round"/></svg></div><div>Motionkan<small>AI CREATIVE STUDIO</small></div></div>
<nav class="nav"><div class="nav-label">WORKSPACE</div>
<button class="active" data-page="home"><span class="ico">⌂</span>Home</button>
<button data-page="drama"><span class="ico">🎬</span>Studio Drama</button><button data-page="video"><span class="ico">▶</span>Studio Video</button><button data-page="image"><span class="ico">▧</span>Studio Gambar</button><button data-page="character"><span class="ico">♙</span>Studio Karakter</button><button data-page="content"><span class="ico">✦</span>Studio Konten</button>
<div class="nav-label">LIBRARY</div><button data-page="assets"><span class="ico">▣</span>Asset Library</button><button data-page="tutorial"><span class="ico">◉</span>Tutorial Center</button><button data-page="projects"><span class="ico">▤</span>Proyek Saya</button><div class="nav-label">ACCOUNT</div><button data-page="settings"><span class="ico">⚙</span>Settings</button></nav>
<div class="sidebottom"><b>✨ Creative workspace</b>Ide → Cerita → Karakter → Scene → Prompt → Review</div></aside>
<main class="main"><div class="mobilehead"><div class="brand"><div class="logo" aria-label="Motionkan.ai logo"><svg viewBox="0 0 64 64" role="img"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7ff35"/><stop offset=".52" stop-color="#b7ff35"/><stop offset="1" stop-color="#a56cff"/></linearGradient></defs><path d="M12 22h13l5-7h12l5 7h5v27H12z" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round"/><circle cx="28" cy="34" r="10" fill="none" stroke="url(#lg)" stroke-width="4"/><path d="M24 43L40 30l-1 8 15-18-11 2 3 5-18 15z" fill="url(#lg)" stroke="#a56cff" stroke-width="1.5" stroke-linejoin="round"/><path d="M18 13h9" stroke="#b7ff35" stroke-width="4" stroke-linecap="round"/></svg></div><div>Motionkan<small>AI CREATIVE STUDIO</small></div></div><button class="btn secondary" id="menuBtn">☰</button></div><div class="top"><div class="crumb">Workspace / <b id="crumb">Home</b></div><div class="profile"><div class="avatar">M</div>Creative workspace</div></div>
<div id="view"></div></main></div>
<div class="modalback" id="modal"><div class="modal"><h2>✨ Buat proyek baru</h2><p>Mulai workspace baru. Data proyek demo disimpan di browser perangkat ini.</p><div class="formgrid"><div class="field wide"><label>Nama proyek</label><input id="projectName" placeholder="Contoh: Drama CEO & Sekretaris"></div><div class="field"><label>Jenis proyek</label><select id="projectType"><option>Drama AI</option><option>Video AI</option><option>Gambar AI</option><option>Konten Sosial Media</option><option>Proyek Bebas</option></select></div><div class="field"><label>Style visual</label><select id="projectStyle"><option>Belum ditentukan</option><option>Realistis / Cinematic</option><option>Manhwa / Webtoon</option><option>Anime</option><option>3D</option><option>Ilustrasi</option><option>Stop Motion</option></select></div></div><div class="modal-actions"><button class="btn secondary" id="cancel">Batal</button><button class="btn" id="saveProject">Simpan Proyek</button></div></div></div><div class="toast" id="toast"></div>
<script>
const views={home:homeView,drama:()=>moduleView('Studio Drama','🎬','Alur cerita lengkap: konsep → script → karakter → outfit → lokasi → scene → storyboard → prompt.','Tahap berikutnya: membangun workflow Drama Director.'),video:()=>moduleView('Studio Video','▶️','Nyanyi & Joget · Drama · Character Replacement · UGC · Product Ads · Cinematic · Talking Character · Stop Motion.','Prompt utama dan negative prompt akan digabung dalam satu blok Bahasa Indonesia.'),image:()=>moduleView('Studio Gambar','🖼️','Character sheet · Portrait · Scene · Poster · Storyboard · Product · Background.','Studio gambar akan memiliki style dan rasio dengan preview.'),character:()=>moduleView('Studio Karakter','♙','Simpan identitas wajah, rambut, outfit, ekspresi, voice DNA, dan continuity locks.','Character DNA dirancang untuk menjaga konsistensi lintas scene.'),content:()=>moduleView('Studio Konten','✦','Ide konten · hook · script · caption · CTA · kalender konten.','Pilih platform dan format untuk menyusun konten.'),assets:()=>moduleView('Asset Library','▣','Kelola referensi foto, video, karakter, outfit, lokasi, props, dan file proyek.','Asset Library akan mendukung tag, pencarian, dan reusable assets.'),tutorial:()=>moduleView('Tutorial Center','◉','Tutorial bertahap dan bantuan kontekstual untuk setiap studio.','Materi tutorial akan ditambahkan saat modul selesai dibangun.'),projects:projectsView,settings:()=>moduleView('Settings','⚙️','Pengaturan akun, preferensi workspace, dan data proyek.','Prototype saat ini menyimpan proyek secara lokal di browser.')};
function homeView(){return `<section class="hero"><div class="eyebrow">YOUR AI CREATIVE WORKSPACE</div><h1>Ide kreatif. Jadi karya. ✨</h1><p>Bangun drama, video, gambar, karakter, dan konten AI dalam satu workspace. Atur alur kerja, jaga konsistensi karakter, dan lanjutkan proyek kapan saja.</p><div class="actions"><button class="btn" id="newProject">＋ Buat Proyek Baru</button><button class="btn secondary" data-go="tutorial">Jelajahi Tutorial</button></div></section><div class="stats"><div class="stat"><span>PROYEK TERSIMPAN</span><strong id="count">0</strong><span>Di browser perangkat ini</span></div><div class="stat"><span>STUDIO</span><strong>5</strong><span>Area kreatif utama</span></div><div class="stat"><span>WORKFLOW</span><strong>∞</strong><span>Ide hingga hasil akhir</span></div></div><div class="section-head"><div><h2>Creative Studios</h2><p>Pilih studio untuk mulai berkarya</p></div></div><div class="grid">${[['drama','🎬','Studio Drama','Konsep, script, karakter, scene, storyboard dan prompt.','STORY WORKFLOW'],['video','▶️','Studio Video','Nyanyi & joget, drama, replacement, UGC, iklan, stop-motion.','VIDEO PROMPT'],['image','🖼️','Studio Gambar','Character sheet, portrait, poster, storyboard dan visual.','IMAGE WORKFLOW'],['character','♙','Studio Karakter','Identitas, wajah, outfit, ekspresi dan continuity lock.','CHARACTER DNA'],['content','✦','Studio Konten','Hook, script, caption, CTA dan konten sosial media.','CONTENT CREATION'],['assets','▣','Asset Library','Organisasi referensi dan asset reusable.','YOUR ASSETS']].map(m=>moduleCard(...m)).join('')}</div><div class="section-head"><div><h2>Proyek Saya</h2><p>Proyek terakhir</p></div><button class="btn secondary" data-go="projects">Lihat semua</button></div><div class="projects" id="recent"></div>`}
function moduleCard(id,icon,title,desc,tag){return `<div class="module" data-go="${id}"><div class="module-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><span class="tag">${tag}</span></div>`}
function moduleView(title,icon,desc,note){return `<div class="pagepanel"><div class="eyebrow">MOTIONKAN STUDIO</div><h2>${icon} ${title}</h2><p>${desc}</p><div class="empty">${note}<br><br><b>Prototype tahap awal:</b> tampilan dan navigasi tersedia; fitur AI, penyimpanan cloud, dan workflow lengkap belum diaktifkan.</div><button class="btn secondary" data-go="home">← Kembali ke Home</button></div>`}
function projectsView(){let list=getProjects();return `<div class="section-head"><div><h2>Proyek Saya</h2><p>Daftar proyek yang disimpan di browser ini</p></div><button class="btn" id="newProject">＋ Proyek Baru</button></div><div class="projects">${list.length?list.map(projectCard).join(''):'<div class="empty">Belum ada proyek. Buat proyek pertamamu ✨</div>'}</div><p style="color:var(--muted);font-size:12px;margin-top:14px">Catatan: prototype belum menyinkronkan data ke akun/cloud dan data hanya tersimpan di browser ini.</p>`}
function projectCard(p){return `<div class="project"><span class="pill">${esc(p.type)}</span><h3>${esc(p.name)}</h3><p>${esc(p.style||'Style belum dipilih')} · ${esc(p.date)}</p></div>`}
function getProjects(){try{return JSON.parse(localStorage.getItem('motionkan_projects')||'[]')}catch{return []}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(page='home'){document.getElementById('view').innerHTML=(views[page]||homeView)();document.getElementById('crumb').textContent=page==='home'?'Home':page[0].toUpperCase()+page.slice(1);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));bind();if(page==='home')refreshRecent()}
function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>render(e.dataset.go));const np=document.getElementById('newProject');if(np)np.onclick=showModal}
function refreshRecent(){let list=getProjects(),el=document.getElementById('recent');document.getElementById('count').textContent=list.length;el.innerHTML=list.length?list.slice(0,4).map(projectCard).join(''):'<div class="empty">Belum ada proyek. Buat proyek pertama untuk mulai membangun karya ✨</div>'}
function showModal(){document.getElementById('modal').style.display='flex';document.getElementById('projectName').focus()}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('cancel').onclick=closeModal;document.getElementById('saveProject').onclick=()=>{let name=document.getElementById('projectName').value.trim();if(!name){document.getElementById('projectName').focus();return}let list=getProjects();list.unshift({name,type:document.getElementById('projectType').value,style:document.getElementById('projectStyle').value,date:new Date().toLocaleDateString('id-ID')});localStorage.setItem('motionkan_projects',JSON.stringify(list));closeModal();render('home');toastMsg('Proyek tersimpan di browser ✨')};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('menuBtn').onclick=()=>toastMsg('Gunakan navigasi studio dari menu desktop; tampilan mobile sedang disederhanakan.');function toastMsg(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>render(e.dataset.go));const np=document.getElementById('newProject');if(np)np.onclick=showModal}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render('home');
</script></body></html>
